<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <style>
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .input { fill: #e8f5e9; stroke: #43a047; stroke-width: 2; }
      .process { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .output { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .event { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1976d2; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .arrow { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .event-arrow { stroke: #8e24aa; stroke-width: 2; fill: none; marker-end: url(#arrowhead-purple); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8e24aa" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title" font-size="20">Data Formatting Flow</text>
  <text x="450" y="50" text-anchor="middle" class="small">How data is transformed and displayed in AG Grid</text>

  <!-- Column 1: Input Data -->
  <text x="150" y="90" text-anchor="middle" class="title">1. Input Data</text>
  
  <rect x="50" y="110" width="200" height="80" rx="5" class="input"/>
  <text x="150" y="135" text-anchor="middle" class="text" font-weight="bold">Raw Cell Value</text>
  <text x="60" y="155" class="small">• Date: "2024-01-15"</text>
  <text x="60" y="170" class="small">• DateTime: 1705305600000</text>
  <text x="60" y="185" class="small">• Time: "14:30:00"</text>

  <!-- Column 2: Configuration -->
  <text x="450" y="90" text-anchor="middle" class="title">2. Format Resolution</text>

  <rect x="320" y="110" width="260" height="120" rx="5" class="process"/>
  <text x="450" y="135" text-anchor="middle" class="text" font-weight="bold">BaseFormatRenderer</text>
  <text x="330" y="155" class="small">Priority (highest to lowest):</text>
  <text x="340" y="175" class="small">1. Column params.fmt override</text>
  <text x="340" y="190" class="small">2. Column params.dateFormat/timeFmt</text>
  <text x="340" y="205" class="small">3. localStorage (user settings)</text>
  <text x="340" y="220" class="small">4. Default: yyyy-MM-dd / HH:mm</text>

  <!-- Column 3: Parsing -->
  <text x="750" y="90" text-anchor="middle" class="title">3. Parse & Validate</text>

  <rect x="640" y="110" width="220" height="120" rx="5" class="process"/>
  <text x="750" y="135" text-anchor="middle" class="text" font-weight="bold">Date Parser</text>
  <text x="650" y="155" class="small">Handles:</text>
  <text x="660" y="175" class="small">• ISO 8601 dates</text>
  <text x="660" y="190" class="small">• Unix timestamps (s/ms)</text>
  <text x="660" y="205" class="small">• Common date formats</text>
  <text x="660" y="220" class="small">• Time-only values</text>

  <!-- Row 2: Formatting -->
  <text x="150" y="290" text-anchor="middle" class="title">4. Format Application</text>

  <rect x="50" y="310" width="200" height="100" rx="5" class="process"/>
  <text x="150" y="335" text-anchor="middle" class="text" font-weight="bold">Angular DatePipe</text>
  <text x="60" y="355" class="small">formatDate(value, fmt, locale)</text>
  <text x="60" y="375" class="small">• Timezone support</text>
  <text x="60" y="390" class="small">• Locale-aware</text>
  <text x="60" y="405" class="small">• Pattern-based</text>

  <!-- Examples -->
  <text x="450" y="290" text-anchor="middle" class="title">5. Format Examples</text>

  <rect x="300" y="310" width="300" height="100" rx="5" class="box"/>
  <text x="450" y="330" text-anchor="middle" class="small" font-weight="bold">Format Patterns → Output</text>
  <text x="310" y="350" class="small">yyyy-MM-dd → 2024-01-15</text>
  <text x="310" y="365" class="small">dd/MM/yyyy → 15/01/2024</text>
  <text x="310" y="380" class="small">HH:mm:ss → 14:30:00</text>
  <text x="310" y="395" class="small">hh:mm a → 02:30 PM</text>

  <!-- Output -->
  <text x="750" y="290" text-anchor="middle" class="title">6. Rendered Output</text>

  <rect x="640" y="310" width="220" height="100" rx="5" class="output"/>
  <text x="750" y="335" text-anchor="middle" class="text" font-weight="bold">Display String</text>
  <text x="650" y="355" class="small">Template: {{ display }}</text>
  <text x="650" y="375" class="small">Change Detection: OnPush</text>
  <text x="650" y="390" class="small">Optimized rendering</text>
  <text x="650" y="405" class="small">No unnecessary updates</text>

  <!-- Event Flow Section -->
  <rect x="50" y="450" width="810" height="200" rx="5" fill="#fafafa" stroke="#8e24aa" stroke-width="2"/>
  <text x="60" y="475" class="title">7. Reactive Update Flow</text>

  <!-- User Action -->
  <rect x="80" y="490" width="150" height="70" rx="5" class="event"/>
  <text x="155" y="515" text-anchor="middle" class="text" font-weight="bold">User Action</text>
  <text x="90" y="535" class="small">Settings UI:</text>
  <text x="90" y="550" class="small">Select new format</text>

  <!-- Event Dispatch -->
  <rect x="270" y="490" width="170" height="70" rx="5" class="event"/>
  <text x="355" y="515" text-anchor="middle" class="text" font-weight="bold">Event Dispatch</text>
  <text x="280" y="535" class="small">1. Save to localStorage</text>
  <text x="280" y="550" class="small">2. CustomEvent fired</text>

  <!-- Listener Response -->
  <rect x="480" y="490" width="170" height="70" rx="5" class="event"/>
  <text x="565" y="515" text-anchor="middle" class="text" font-weight="bold">Event Listeners</text>
  <text x="490" y="535" class="small">window:storage</text>
  <text x="490" y="550" class="small">window:dt-format-changed</text>

  <!-- Re-render -->
  <rect x="690" y="490" width="150" height="70" rx="5" class="event"/>
  <text x="765" y="515" text-anchor="middle" class="text" font-weight="bold">Auto Re-render</text>
  <text x="700" y="535" class="small">All cell renderers</text>
  <text x="700" y="550" class="small">update instantly</text>

  <!-- Sync Note -->
  <rect x="80" y="580" width="760" height="50" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="90" y="600" class="small" font-weight="bold">🔄 Cross-Tab Sync:</text>
  <text x="90" y="618" class="small">Changes in one browser tab automatically update all other tabs via storage events</text>

  <!-- Arrows for main flow -->
  <path d="M 250 150 L 320 150" class="arrow"/>
  <path d="M 580 150 L 640 150" class="arrow"/>
  <path d="M 750 230 L 750 310" class="arrow"/>
  <path d="M 150 230 L 150 310" class="arrow"/>
  <path d="M 250 360 L 300 360" class="arrow"/>
  <path d="M 600 360 L 640 360" class="arrow"/>

  <!-- Arrows for event flow -->
  <path d="M 230 525 L 270 525" class="event-arrow"/>
  <path d="M 440 525 L 480 525" class="event-arrow"/>
  <path d="M 650 525 L 690 525" class="event-arrow"/>

  <!-- Labels on arrows -->
  <text x="280" y="145" class="small">resolve</text>
  <text x="605" y="145" class="small">parse</text>
  <text x="760" y="270" class="small">render</text>
  <text x="160" y="270" class="small">format</text>
</svg>
