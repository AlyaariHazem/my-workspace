<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .highlight { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .service { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .storage { fill: #f1f8e9; stroke: #689f38; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1976d2; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .arrow { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title" font-size="20">data-trans-library Architecture</text>

  <!-- Angular App Layer -->
  <rect x="50" y="60" width="700" height="500" rx="5" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="60" y="80" class="small">Angular Application</text>

  <!-- Settings UI Component -->
  <rect x="80" y="100" width="180" height="100" rx="5" class="highlight"/>
  <text x="170" y="125" text-anchor="middle" class="title">Settings UI</text>
  <text x="170" y="145" text-anchor="middle" class="small">SettingsComponent</text>
  <text x="90" y="165" class="small">• Date format picker</text>
  <text x="90" y="180" class="small">• Time format picker</text>
  <text x="90" y="195" class="small">• Live preview</text>

  <!-- Settings Service -->
  <rect x="310" y="100" width="180" height="100" rx="5" class="service"/>
  <text x="400" y="125" text-anchor="middle" class="title">SettingsService</text>
  <text x="400" y="145" text-anchor="middle" class="small">State Management</text>
  <text x="320" y="165" class="small">• BehaviorSubject</text>
  <text x="320" y="180" class="small">• Format validation</text>
  <text x="320" y="195" class="small">• Event dispatch</text>

  <!-- localStorage -->
  <rect x="540" y="100" width="180" height="100" rx="5" class="storage"/>
  <text x="630" y="125" text-anchor="middle" class="title">localStorage</text>
  <text x="630" y="145" text-anchor="middle" class="small">Persistence Layer</text>
  <text x="550" y="165" class="small">• selectedDateFormat</text>
  <text x="550" y="180" class="small">• selectedTimeFormat</text>
  <text x="550" y="195" class="small">• Cross-tab sync</text>

  <!-- AG Grid Integration -->
  <rect x="80" y="250" width="640" height="150" rx="5" fill="none" stroke="#1976d2" stroke-width="2"/>
  <text x="90" y="270" class="title">AG Grid Cell Renderers</text>

  <!-- Date Renderer -->
  <rect x="100" y="290" width="140" height="90" rx="5" class="box"/>
  <text x="170" y="310" text-anchor="middle" class="text" font-weight="bold">DateCell</text>
  <text x="110" y="330" class="small">kind: 'date'</text>
  <text x="110" y="345" class="small">format: yyyy-MM-dd</text>
  <text x="110" y="360" class="small">OnPush strategy</text>
  <text x="110" y="375" class="small">Auto re-render</text>

  <!-- Time Renderer -->
  <rect x="260" y="290" width="140" height="90" rx="5" class="box"/>
  <text x="330" y="310" text-anchor="middle" class="text" font-weight="bold">TimeCell</text>
  <text x="270" y="330" class="small">kind: 'time'</text>
  <text x="270" y="345" class="small">format: HH:mm</text>
  <text x="270" y="360" class="small">OnPush strategy</text>
  <text x="270" y="375" class="small">Auto re-render</text>

  <!-- DateTime Renderer -->
  <rect x="420" y="290" width="140" height="90" rx="5" class="box"/>
  <text x="490" y="310" text-anchor="middle" class="text" font-weight="bold">DateTimeCell</text>
  <text x="430" y="330" class="small">kind: 'datetime'</text>
  <text x="430" y="345" class="small">combined format</text>
  <text x="430" y="360" class="small">OnPush strategy</text>
  <text x="430" y="375" class="small">Auto re-render</text>

  <!-- Currency Renderer -->
  <rect x="580" y="290" width="120" height="90" rx="5" class="box"/>
  <text x="640" y="310" text-anchor="middle" class="text" font-weight="bold">Currency</text>
  <text x="590" y="330" class="small">Locale-aware</text>
  <text x="590" y="345" class="small">Custom symbols</text>
  <text x="590" y="360" class="small">Auto update</text>

  <!-- Base Renderer -->
  <rect x="240" y="440" width="320" height="70" rx="5" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
  <text x="400" y="465" text-anchor="middle" class="title">BaseFormatRenderer</text>
  <text x="250" y="485" class="small">• window:storage listener (cross-tab sync)</text>
  <text x="250" y="500" class="small">• window:dt-format-changed listener (same-tab updates)</text>

  <!-- Arrows -->
  <!-- Settings UI -> Settings Service -->
  <path d="M 260 150 L 310 150" class="arrow"/>
  <text x="275" y="145" class="small">Apply</text>

  <!-- Settings Service -> LocalStorage -->
  <path d="M 490 150 L 540 150" class="arrow"/>
  <text x="505" y="145" class="small">Save</text>

  <!-- LocalStorage -> Settings Service (dashed for sync) -->
  <path d="M 540 170 L 490 170" class="arrow dashed"/>
  <text x="505" y="190" class="small">Load</text>

  <!-- Settings Service -> Renderers (event dispatch) -->
  <path d="M 400 200 L 400 290" class="arrow"/>
  <text x="410" y="240" class="small">CustomEvent</text>

  <!-- LocalStorage -> Renderers (cross-tab) -->
  <path d="M 630 200 L 630 240 L 560 240 L 560 290" class="arrow dashed"/>
  <text x="570" y="235" class="small">storage event</text>

  <!-- Renderers -> BaseRenderer -->
  <path d="M 170 380 L 170 420 L 300 420 L 300 440" class="arrow"/>
  <path d="M 330 380 L 330 420 L 360 420 L 360 440" class="arrow"/>
  <path d="M 490 380 L 490 420 L 450 420 L 450 440" class="arrow"/>

  <!-- Legend -->
  <rect x="50" y="530" width="700" height="50" rx="5" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="550" class="small" font-weight="bold">Legend:</text>
  <line x1="120" y1="545" x2="170" y2="545" class="arrow"/>
  <text x="180" y="550" class="small">Data flow</text>
  <line x1="260" y1="545" x2="310" y2="545" class="arrow dashed"/>
  <text x="320" y="550" class="small">Event listener</text>
  <rect x="420" y="535" width="15" height="15" class="highlight"/>
  <text x="440" y="548" class="small">UI Component</text>
  <rect x="540" y="535" width="15" height="15" class="service"/>
  <text x="560" y="548" class="small">Service</text>
  <rect x="640" y="535" width="15" height="15" class="storage"/>
  <text x="660" y="548" class="small">Storage</text>
</svg>
